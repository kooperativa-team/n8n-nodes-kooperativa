# Publishes this n8n community node package to npm on every version tag push.
#
# n8n requires all community nodes submitted for Creator Portal verification
# to be published via GitHub Actions with an npm provenance statement.
# Provenance lets anyone cryptographically verify that a package was built by
# this exact workflow, from this exact repository and commit.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open this package's settings.
#   2. Under "Publish access" -> "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: kooperativa-team
#        Repository name:  n8n-nodes-kooperativa
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   4. Leave the NPM_TOKEN secret unset. GitHub's OIDC token is used instead.
#
# Option B — npm Granular Access Token (fallback):
#   1. On npmjs.com: Access Tokens -> Generate New Token -> Granular Access Token.
#      Scope it to this package with "Read and write" publish permission.
#   2. In GitHub: Settings -> Secrets and variables -> Actions -> New secret.
#      Name it NPM_TOKEN and paste the token value.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────
#
# Bump the version in package.json, commit, then tag and push:
#   git tag 0.2.0 && git push origin 0.2.0
# The tag push triggers this workflow, which builds and publishes to npm.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
